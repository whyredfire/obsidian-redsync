# Red Sync server: the server and Litestream (database backup to R2). Put your own HTTPS reverse proxy in front of
# 127.0.0.1:8080; it must pass WebSocket upgrades (path /v1/ws).
#   cp .env.example .env   # then fill it in
#   docker compose up -d
# Administration: docker compose exec server redsync-server help

x-r2: &r2
  AWS_ENDPOINT: ${R2_ENDPOINT}
  AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
  AWS_REGION: auto

services:
  # On a fresh disk, brings the database back from R2 before the server starts; does nothing otherwise.
  restore:
    image: litestream/litestream:0.5.18
    command: restore -config /etc/litestream.yml -if-db-not-exists -if-replica-exists /data/redsync.db
    env_file: .env
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro

  server:
    image: ${REDSYNC_IMAGE:-ghcr.io/whyredfire/obsidian-redsync}:${REDSYNC_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      restore:
        condition: service_completed_successfully
    environment:
      <<: *r2
      REDSYNC_DATA: /data
      REDSYNC_STORE: s3://${R2_BUCKET}
      REDSYNC_CACHE_MAX: ${REDSYNC_CACHE_MAX:-2GB}
      REDSYNC_MAX_FILE: ${REDSYNC_MAX_FILE:-100MB}
      REDSYNC_SNAPSHOT_HOURS: ${REDSYNC_SNAPSHOT_HOURS:-6}
      RUST_LOG: info
    ports: ["127.0.0.1:${REDSYNC_PORT:-8080}:8080"]
    volumes:
      - data:/data

  # Copies database changes to R2 every 10 seconds (litestream.yml).
  litestream:
    image: litestream/litestream:0.5.18
    restart: unless-stopped
    command: replicate -config /etc/litestream.yml
    depends_on:
      restore:
        condition: service_completed_successfully
    env_file: .env
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro

volumes:
  data: {}
