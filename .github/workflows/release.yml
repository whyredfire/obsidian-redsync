name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0
        required: true

permissions:
  contents: read

concurrency: release

jobs:
  check:
    runs-on: ubuntu-slim
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 0.1.0"; exit 1; }'

  server:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Test the server
        working-directory: server
        run: cargo test --locked

  plugin:
    needs: check
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Build and test the plug-in
        working-directory: plugin
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test

  image:
    needs: check
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      context: server
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: redsync-server
      build-args: |
        VERSION=${{ inputs.version }}
      sbom: true
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=raw,value=${{ inputs.version }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [server, plugin, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2

      - name: Set the version
        run: node version-bump.mjs "$VERSION"

      - name: Build the plug-in
        working-directory: plugin
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the new image
        run: docker buildx imagetools create -t "ghcr.io/${GITHUB_REPOSITORY}:latest" "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"

      - name: Commit, tag, and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: Release ${VERSION}"
          git tag "$VERSION"
          git push origin HEAD "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes plugin/build/main.js manifest.json plugin/build/styles.css
