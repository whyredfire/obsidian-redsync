{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "red-sync.pvcName" . }}
  labels:
    {{- include "red-sync.labels" . | nindent 4 }}
  annotations:
    # The cache and database survive uninstalling; R2 holds everything, but restoring takes time
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
