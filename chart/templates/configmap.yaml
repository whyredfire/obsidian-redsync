apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "red-sync.fullname" . }}
  labels:
    {{- include "red-sync.labels" . | nindent 4 }}
data:
  AWS_ENDPOINT: {{ required "Set r2.endpoint" .Values.r2.endpoint | quote }}
  AWS_REGION: {{ .Values.r2.region | quote }}
  {{- if eq (urlParse .Values.r2.endpoint).scheme "http" }}
  # An in-cluster store without TLS, e.g. Garage
  AWS_ALLOW_HTTP: "true"
  {{- end }}
  REDSYNC_STORE: {{ printf "s3://%s" (required "Set r2.bucket" .Values.r2.bucket) | quote }}
  REDSYNC_DATA: /data
  REDSYNC_CACHE_MAX: {{ .Values.server.cacheMax | quote }}
  REDSYNC_MAX_FILE: {{ .Values.server.maxFile | quote }}
  REDSYNC_SNAPSHOT_HOURS: {{ .Values.server.snapshotHours | quote }}
  RUST_LOG: {{ .Values.server.logLevel | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "red-sync.fullname" . }}-litestream
  labels:
    {{- include "red-sync.labels" . | nindent 4 }}
data:
  # Like deploy/litestream.yml; the keys come from AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
  litestream.yml: |
    dbs:
      - path: /data/redsync.db
        replica:
          type: s3
          bucket: {{ .Values.r2.bucket }}
          path: litestream
          endpoint: {{ .Values.r2.endpoint }}
          region: {{ .Values.r2.region }}
          force-path-style: true
          sync-interval: {{ .Values.litestream.syncInterval }}
