{{- if not .Values.r2.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "red-sync.r2SecretName" . }}
  labels:
    {{- include "red-sync.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Read by both the server and Litestream
  AWS_ACCESS_KEY_ID: {{ required "Set r2.accessKeyId or r2.existingSecret" .Values.r2.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "Set r2.secretAccessKey or r2.existingSecret" .Values.r2.secretAccessKey | quote }}
{{- end }}
