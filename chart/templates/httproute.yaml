{{- if .Values.httpRoute.enabled }}
# Devices keep a WebSocket open at /v1/ws; the gateway must allow upgrades and long-lived connections
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "red-sync.fullname" . }}
  labels:
    {{- include "red-sync.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ required "Set httpRoute.hostname" .Values.httpRoute.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      {{- with .Values.httpRoute.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "red-sync.fullname" . }}
          port: 8080
{{- end }}
