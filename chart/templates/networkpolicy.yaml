{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "red-sync.fullname" . }}
  labels:
    {{- include "red-sync.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "red-sync.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.gateway | nindent 8 }}
      ports:
        - port: 8080
  egress:
    {{- include "red-sync.dnsEgress" . | nindent 4 }}
    # R2, or another S3 store, for the server and Litestream
    - to:
        {{- toYaml .Values.networkPolicy.r2 | nindent 8 }}
      ports:
        - port: {{ include "red-sync.r2Port" . }}
{{- end }}
