name: redsync-testbench

x-obsidian: &obsidian
  build: ./obsidian
  shm_size: 1gb
  # The devices reach the server only through "sync", so cutting that network takes a device offline
  # while its DevTools port (on "default") stays reachable.
  networks: [default, sync]
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: Etc/UTC
    RESTART_APP: "true"

services:
  server:
    build: ../server
    environment:
      REDSYNC_LISTEN: 0.0.0.0:8080
      REDSYNC_DATA: /data
      # A folder stands in for R2 on the test bench.
      REDSYNC_STORE: file:///data/r2
      # Small, so the test of a file over the limit stays quick.
      REDSYNC_MAX_FILE: 2MB
    volumes:
      - server:/data
    networks: [sync]
    ports: ["127.0.0.1:8080:8080"]

  # Device A: vault on the container's case-sensitive file system.
  obsidian-a:
    <<: *obsidian
    ports: ["127.0.0.1:3001:3001", "127.0.0.1:9223:9223"]
    volumes:
      - obsidian-a:/config
      - ../plugin/build:/config/vault/.obsidian/plugins/red-sync:ro

  # Device B: vault in a folder on the Mac, case-insensitive like macOS.
  obsidian-b:
    <<: *obsidian
    ports: ["127.0.0.1:3002:3001", "127.0.0.1:9224:9223"]
    volumes:
      - obsidian-b:/config
      - ./data/vault-b:/config/vault
      - ../plugin/build:/config/vault/.obsidian/plugins/red-sync:ro

networks:
  sync: {}

volumes:
  server: {}
  obsidian-a: {}
  obsidian-b: {}
