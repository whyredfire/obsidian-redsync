[package]
name = "redsync-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.2"
futures-util = "0.3.34"
getrandom = "0.4.3"
hkdf = "0.13.0"
object_store = { version = "0.14.2", features = ["aws"] }
pbkdf2 = "0.13.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "time", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
url = "2.5.9"

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
